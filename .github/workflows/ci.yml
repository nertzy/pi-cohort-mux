name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_VERSION: 1.3.0
  CMUX_VERSION: 0.65.2

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }} · tmux + pi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        node-version: [22.x, 24.x, 26.x]
        # tmux 3.4 can miss a pane's exit; keep one job on it so the spikes'
        # tmux-version guards stay exercised.
        include:
          - os: ubuntu-24.04
            node-version: 24.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Pi-backed and real-tmux tests resolve `pi` and `tmux` from PATH and
      # skip without them, so install both. The cmux tests skip here; the
      # macOS job runs them against a real app.
      - run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION"
      - run: sudo apt-get install --yes --no-install-recommends tmux
      - run: npm test

  cmux:
    name: macOS · real cmux
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION"
      - run: brew install tmux
      - name: Install cmux
        run: |
          curl -fsSLo "$RUNNER_TEMP/cmux.dmg" "https://github.com/manaflow-ai/cmux/releases/download/v$CMUX_VERSION/cmux-macos.dmg"
          volume=$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/cmux.dmg" | awk -F '\t' '/\/Volumes\// { print $NF }')
          cp -R "$volume/cmux.app" /Applications/
          hdiutil detach "$volume"
      - run: npm test
      - name: Launch cmux
        run: |
          echo /Applications/cmux.app/Contents/Resources/bin >> "$GITHUB_PATH"
          # Keep the first-launch announcement window and update checks out
          # of the test session.
          defaults write com.cmuxterm.app cmux.cloud.welcome.seenVersion "$CMUX_VERSION"
          defaults write com.cmuxterm.app SUEnableAutomaticChecks -bool false
          # allowAll admits clients that cmux did not spawn, such as this job.
          open -a /Applications/cmux.app --env CMUX_SOCKET_MODE=allowAll \
            --stdout "$RUNNER_TEMP/cmux.log" --stderr "$RUNNER_TEMP/cmux.log"
      - name: Export the cmux session
        run: |
          for _ in $(seq 60); do cmux ping > /dev/null 2>&1 && break; sleep 1; done
          cmux ping
          cmux --version
          cmux capabilities | jq -c .capabilities
          {
            echo "CMUX_SOCKET_PATH=$(cmux socket-status --json | jq -er .socket_path)"
            echo "CMUX_WORKSPACE_ID=$(cmux --id-format uuids workspace list --json | jq -er '.workspaces[0].id')"
          } >> "$GITHUB_ENV"
      - name: Test against real cmux
        shell: bash
        timeout-minutes: 5
        env:
          PI_COHORT_MUX_PRODUCTION_CMUX_SMOKE: "1"
        run: |
          # One file at a time: both drive the same app, which they must not share.
          node --test --test-concurrency=1 --test-force-exit test/cmux-parity-spike.test.mjs test/production-cmux-smoke.test.mjs | tee "$RUNNER_TEMP/cmux-tests.log"
          # A missing prerequisite skips rather than fails; treat it as a failure here.
          grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/cmux-tests.log"
      - name: Capture cmux state
        if: failure()
        run: |
          cmux --id-format both tree --all > "$RUNNER_TEMP/cmux-tree.txt" 2>&1 || true
          screencapture -x "$RUNNER_TEMP/screen.png" || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmux-diagnostics
          path: |
            ${{ runner.temp }}/cmux.log
            ${{ runner.temp }}/cmux-tests.log
            ${{ runner.temp }}/cmux-tree.txt
            ${{ runner.temp }}/screen.png
            /tmp/pi-cohort-mux-production-cmux-smoke.md
          if-no-files-found: ignore
